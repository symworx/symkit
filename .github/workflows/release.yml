# Release validation + publish.
# SymWorx org standard (default branch `worx`).
# See DEVELOPMENT.md for additional information.
#
# GitHub Flow:
#   feature/* ──PR──► worx ──tag──► vX.Y.Z
# Optional freeze: push to release/** then PR back to worx.
#
# Validation (meta, fmt, clippy/tests, Python + wheel smoke) runs on:
#   - PRs into main (legacy freeze PRs during cutover)
#   - pushes to release/**
#   - tags v*
#   - workflow_dispatch (checks only; does not publish)
#
# Publish (crates.io, PyPI, GitHub Release) runs only on tags v*, after
# validation succeeds. Create tags manually on worx.

name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  # Re-run validation on a branch without publishing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Metadata: version / changelog / branch conventions for the release path
  # ---------------------------------------------------------------------------
  release-meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION=$(
            awk '
              $0 ~ /^\[package\]/ { in_pkg=1; next }
              in_pkg && $0 ~ /^\[/ { in_pkg=0 }
              in_pkg && $0 ~ /^version/ {
                if (match($0, /"[^"]+"/)) {
                  print substr($0, RSTART+1, RLENGTH-2)
                  exit
                }
              }
            ' Cargo.toml
          )
          if [[ -z "${PKG_VERSION}" ]]; then
            echo "::error::Could not read [package] version from Cargo.toml"
            exit 1
          fi
          echo "package_version=${PKG_VERSION}"

          IS_TAG=false
          IS_PRERELEASE=false
          TAG_VERSION=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IS_TAG=true
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" == *-* ]]; then
              IS_PRERELEASE=true
            fi
          fi

          # release/vX.Y.Z branch naming (push or PR head)
          BRANCH_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [[ "${BRANCH_REF}" == release/* ]]; then
            BRANCH_VERSION="${BRANCH_REF#release/}"
            BRANCH_VERSION="${BRANCH_VERSION#v}"
            if [[ "${BRANCH_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "::error::release branch '${BRANCH_REF}' version (${BRANCH_VERSION}) does not match Cargo.toml package version (${PKG_VERSION})"
              exit 1
            fi
          fi

          if [[ "${IS_TAG}" == "true" ]]; then
            if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "::error::Tag v${TAG_VERSION} does not match Cargo.toml package version ${PKG_VERSION}"
              exit 1
            fi
            # Final releases should land on worx; develop/main remain valid during the rename.
            if [[ "${IS_PRERELEASE}" != "true" ]]; then
              trunk=""
              for b in worx develop main; do
                git fetch --no-tags origin "$b:refs/remotes/origin/$b" 2>/dev/null || true
                if git rev-parse --verify "origin/$b" >/dev/null 2>&1; then
                  trunk=$b
                  break
                fi
              done
              if [[ -n "${trunk}" ]]; then
                if git merge-base --is-ancestor HEAD "origin/${trunk}" 2>/dev/null; then
                  echo "Tag commit is on ${trunk} (or an ancestor of ${trunk})."
                else
                  echo "::warning::Tag v${TAG_VERSION} is not an ancestor of ${trunk}. Final releases should be tagged on worx."
                fi
              else
                echo "::warning::No trunk branch (worx/develop/main) found; skipping ancestor check for tag v${TAG_VERSION}."
              fi
            fi
          fi

          # CHANGELOG: require a heading for this version (final and pre-release tags,
          # and release/* branches). Keep Unreleased PRs to worx flexible.
          if [[ "${IS_TAG}" == "true" || "${BRANCH_REF}" == release/* ]]; then
            if ! grep -Eq "^## \[${PKG_VERSION}\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md missing '## [${PKG_VERSION}]' section for this release"
              exit 1
            fi
          fi

          {
            echo "version=${PKG_VERSION}"
            echo "is_tag=${IS_TAG}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Release metadata: version=${PKG_VERSION} is_tag=${IS_TAG} is_prerelease=${IS_PRERELEASE}"
          if [[ "${IS_TAG}" == "true" ]]; then
            echo "Tag push: publish jobs will run after validation succeeds."
          else
            echo "Branch/PR: validation only (publish runs on tags v* only)."
          fi

  # Re-run the same gate as CI so a tag cannot skip checks.
  check:
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --quiet
      - run: ./tests/smoke.sh

  # Native release binaries. Tag only — PRs and release branches skip this.
  build-binaries:
    name: ${{ matrix.target }}
    needs: [release-meta, check]
    if: needs.release-meta.outputs.is_tag == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl-tools
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Smoke the binary
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/symkit"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            BIN="${BIN}.exe"
          fi
          "${BIN}" --help | grep -q FLOW
          "${BIN}" guide | grep -q 'cargo install'
      - name: Package
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCHIVE="$(./scripts/package-release-binary.sh \
            "${{ needs.release-meta.outputs.version }}" \
            "${{ matrix.target }}" \
            dist)"
          REL="dist/$(basename "${ARCHIVE}")"
          echo "archive=${REL}" >> "${GITHUB_OUTPUT}"
          ls -l dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/symkit-*
          if-no-files-found: error
          retention-days: 7

  # Aggregate gate used by branch protection / required checks
  release-ready:
    name: Release checks passed
    runs-on: ubuntu-latest
    needs: [release-meta, check, build-binaries]
    if: always()
    steps:
      - name: Require all validation jobs
        run: |
          set -euo pipefail
          echo "release-meta: ${{ needs.release-meta.result }}"
          echo "check: ${{ needs.check.result }}"
          echo "build-binaries: ${{ needs.build-binaries.result }}"
          test "${{ needs.release-meta.result }}" = "success"
          test "${{ needs.check.result }}" = "success"
          if [[ "${{ needs.release-meta.outputs.is_tag }}" == "true" ]]; then
            test "${{ needs.build-binaries.result }}" = "success"
          else
            test "${{ needs.build-binaries.result }}" = "skipped"
          fi
          echo "All release validation jobs passed for v${{ needs.release-meta.outputs.version }}"
          echo "On tag pushes: github-release + publish-crates run next."

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [release-meta, release-ready, build-binaries]
    if: needs.release-meta.outputs.is_tag == 'true' && needs.release-ready.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum symkit-* | tee SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release-meta.outputs.version }}
          name: v${{ needs.release-meta.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.release-meta.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: dist/*

  # Independent of github-release so a crates.io failure cannot block the
  # GitHub Release page.
  publish-crates:
    name: Publish crates.io
    runs-on: ubuntu-latest
    needs: [release-meta, release-ready]
    if: needs.release-meta.outputs.is_tag == 'true' && needs.release-ready.result == 'success'
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish symkit
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
