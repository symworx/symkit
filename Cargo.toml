[package]
name = "symkit"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Nathaniel T. Berry"]
license = "Apache-2.0"
description = "Installable agent harnesses for teaching, research, AI, product, and engineering work"
repository = "https://github.com/symworx/symkit"
readme = "README.md"

[[bin]]
name = "symkit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2.0"
walkdir = "2.5"
include_dir = "0.7"

[dev-dependencies]
tempfile = "3.14"
