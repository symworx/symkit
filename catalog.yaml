# symkit catalog — single source of truth for cli/symkit
version: 4

kit:
  name: symkit
  description: Installable agent harnesses for teaching, research, AI, product, creative, performance, and engineering work

adapters:
  default: [grok]
  all: [grok, claude, codex]
  grok:
    rules: .grok/rules
    skills: .grok/skills
    agents: .grok/agents
  claude:
    pointer_file: CLAUDE.md
    rules: .claude/rules
    skills: .claude/skills
    agents: .claude/agents
  codex:
    skills: .codex/skills

canonical:
  agents_md: AGENTS.md
  agents_overlay: AGENTS-SYMKIT.md
  root: .agents
  rules: .agents/rules
  skills: .agents/skills
  agents: .agents/agents
  state: .symkit/state.yaml

library:
  skills: core/library/skills

core:
  rules: core/rules
  always_skills: [check-citations]
  templates: core/templates

harnesses:
  teaching:
    status: active
    description: Course materials, staff and learner agents, assignment structure
    default_role: instructor
    offer_migration_docs: true
    workspace: harnesses/teaching/workspace
    templates:
      slos:
        path: harnesses/teaching/templates/slos.md
        dest: slos.md
    packages:
      shared:
        description: Materials AGENTS, course-materials and slos-as-truth rules
        path: harnesses/teaching/packages/shared
        student_safe: true
      staff:
        description: Engagement norms (evaluate-content is assigned via role skills)
        path: harnesses/teaching/packages/staff
        student_safe: false
      instructor:
        description: Instructor agent plus instructor-only rules
        path: harnesses/teaching/packages/instructor
        student_safe: false
      ta:
        description: TA agent only (pair with staff; no course design skills)
        path: harnesses/teaching/packages/ta
        student_safe: false
      learner:
        description: Student literacy docs plus learner agent and study skills
        path: harnesses/teaching/packages/learner
        student_safe: true
    roles:
      instructor:
        packages: [shared, staff, instructor]
        skills:
          [write-gherkin, evaluate-content, course-prep, week-plan,
           assignment-review, accessibility-review, release-materials,
           migrate-course]
      faculty:
        packages: [shared, staff, instructor]
        skills:
          [write-gherkin, evaluate-content, course-prep, week-plan,
           assignment-review, accessibility-review, release-materials,
           migrate-course]
      ta:
        packages: [shared, staff, ta]
        skills: [write-gherkin, evaluate-content]
      learner:
        packages: [shared, learner]
        skills:
          [check-understanding, create-and-revise-docs, lab-tutor, study-plan]
      materials:
        packages: [shared]
        skills: [write-gherkin, release-materials]
    prune:
      ta:
        agents: [instructor]
        rules: [course-prep, week-plan, assignment-review, accessibility]
      instructor:
        agents: [ta]
      faculty:
        agents: [ta]
      learner:
        agents: [instructor, ta, materials-author]
        rules: [course-prep, week-plan, assignment-review, accessibility, evaluate-content, student-engagement]

  research:
    status: active
    description: Experiment layout, reproducibility, paper-oriented research repos
    default_role: researcher
    workspace: harnesses/research/workspace
    templates:
      aims:
        path: harnesses/research/templates/aims.md
        dest: aims.md
      protocol:
        path: harnesses/research/templates/protocol.md
        dest: protocol.md
    packages:
      shared:
        description: Research AGENTS, aims-as-truth, layout conventions
        path: harnesses/research/packages/shared
        student_safe: true
    roles:
      researcher:
        packages: [shared]
        skills:
          [write-gherkin, study-layout, repro-check, write-manuscript,
           write-abstract, review-manuscript, lit-matrix, response-to-reviewers]
      materials:
        packages: [shared]
        skills: [write-gherkin, study-layout, repro-check]
    prune: {}

  ai:
    status: active
    description: Model-run scaffolding, evaluation logs, provenance
    default_role: experimenter
    workspace: harnesses/ai/workspace
    packages:
      shared:
        description: Experiment AGENTS, config-as-source, eval-run skill
        path: harnesses/ai/packages/shared
        student_safe: true
    roles:
      experimenter:
        packages: [shared]
        skills: [config-check, eval-run, repro-check]
      materials:
        packages: [shared]
        skills: [config-check]
    prune: {}

  product:
    status: active
    description: Specs, roadmap, and shipping notes for product repos
    default_role: product-manager
    workspace: harnesses/product/workspace
    packages:
      shared:
        description: Product AGENTS and written-truth rules
        path: harnesses/product/packages/shared
        student_safe: true
      product-manager:
        description: Product-manager agent
        path: harnesses/product/packages/product-manager
        student_safe: true
    roles:
      product-manager:
        packages: [shared, product-manager]
        skills:
          [write-prd, roadmap, release-notes, write-gherkin, accessibility-review]
      pm:
        packages: [shared, product-manager]
        skills:
          [write-prd, roadmap, release-notes, write-gherkin, accessibility-review]
      materials:
        packages: [shared]
        skills: [write-gherkin, write-prd]
    prune:
      materials:
        agents: [product-manager]

  creative:
    status: active
    description: Voice, naming, copy, and asset briefs for brand work
    default_role: creative-director
    workspace: harnesses/creative/workspace
    packages:
      shared:
        description: Creative AGENTS and brand-as-truth rules
        path: harnesses/creative/packages/shared
        student_safe: true
      creative-director:
        description: Creative-director agent
        path: harnesses/creative/packages/creative-director
        student_safe: true
    roles:
      creative-director:
        packages: [shared, creative-director]
        skills:
          [brand-voice, critique-copy, naming, asset-brief, accessibility-review]
      creative:
        packages: [shared, creative-director]
        skills:
          [brand-voice, critique-copy, naming, asset-brief, accessibility-review]
      materials:
        packages: [shared]
        skills: [brand-voice, accessibility-review]
    prune:
      materials:
        agents: [creative-director]

  performance:
    status: active
    description: Exercise physiology and biomechanics for human performance
    default_role: coach
    workspace: harnesses/performance/workspace
    packages:
      shared:
        description: Performance AGENTS, program-as-truth, no-clinical, wrap-kernels
        path: harnesses/performance/packages/shared
        student_safe: true
      coach:
        description: Coach agent (physiology + biomechanics)
        path: harnesses/performance/packages/coach
        student_safe: true
    roles:
      coach:
        packages: [shared, coach]
        skills:
          [session-plan, program-check, movement-review, physio-explain,
           signal-quality, write-gherkin, repro-check]
      performance-coach:
        packages: [shared, coach]
        skills:
          [session-plan, program-check, movement-review, physio-explain,
           signal-quality, write-gherkin, repro-check]
      materials:
        packages: [shared]
        skills: [write-gherkin, repro-check]
    prune:
      materials:
        agents: [coach]

  engineering:
    status: active
    description: Software engineering for application and library repos
    default_role: engineer
    workspace: harnesses/engineering/workspace
    packages:
      shared:
        description: Engineering AGENTS, match-repo rules
        path: harnesses/engineering/packages/shared
        student_safe: true
      engineer:
        description: Engineer / SWE agent
        path: harnesses/engineering/packages/engineer
        student_safe: true
    roles:
      engineer:
        packages: [shared, engineer]
        skills: [write-tests, write-docs, write-gherkin, repro-check]
      swe:
        packages: [shared, engineer]
        skills: [write-tests, write-docs, write-gherkin, repro-check]
      materials:
        packages: [shared]
        skills: [write-gherkin, repro-check]
    prune:
      materials:
        agents: [engineer]
